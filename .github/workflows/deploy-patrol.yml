name: Deploy AccessEasy Patrol App to AWS

on:
  push:
    branches: [ patrol ]
  workflow_dispatch:

jobs:
  deploy-patrol:
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Backup source code to S3
        run: |
          echo "💾 Creating source code backup..."
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          COMMIT_SHORT=${{ github.sha }}
          COMMIT_SHORT=${COMMIT_SHORT:0:7}
          BACKUP_NAME="patrol-source-backup-${TIMESTAMP}-${COMMIT_SHORT}.tar.gz"
          
          tar -czf "${BACKUP_NAME}" \
            --exclude='node_modules' \
            --exclude='dist' \
            --exclude='build' \
            --exclude='.git' \
            --exclude='.next' \
            --warning=no-file-changed \
            --warning=no-file-removed \
            . || if [ $? -eq 1 ]; then true; else exit $?; fi
          
          aws s3 cp "${BACKUP_NAME}" "s3://accesseasy-patrol-assets/source-backups/${BACKUP_NAME}"
          echo "✅ Backup stored: source-backups/${BACKUP_NAME}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build AccessEasy Patrol App
        run: |
          echo "🔨 Building AccessEasy Patrol App..."
          echo "📅 Build time: $(date)"
          echo "🆔 Commit: ${{ github.sha }}"
          npm run build:patrol
          echo "✅ Build completed successfully!"
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_DIRECTUS_URL: ${{ secrets.VITE_DIRECTUS_URL }}
          VITE_API_TOKEN: ${{ secrets.VITE_API_TOKEN }}
          VITE_FIELDSEASY_DOMAIN: ${{ secrets.VITE_FIELDSEASY_DOMAIN }}
          VITE_KN_API_URL: ${{ secrets.VITE_KN_API_URL || 'https://appv1.fieldseasy.com/kn' }}
          VITE_UI_URL: ${{ secrets.VITE_UI_URL }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}

      - name: Verify build output
        run: |
          echo "🔍 Verifying build..."
          if [ ! -d "dist/patrol" ]; then
            echo "❌ dist/patrol folder NOT found - build failed"
            exit 1
          fi
          
          if [ ! -f "dist/patrol/index.html" ]; then
            echo "❌ dist/patrol/index.html NOT found - build failed"
            exit 1
          fi
          
          echo "✅ Build verification passed"
          echo "📁 Build contents:"
          ls -la dist/patrol/

      - name: Deploy to S3
        run: |
          echo "🚀 Deploying Patrol App to S3..."
          if aws s3 sync dist/patrol/ s3://accesseasy-patrol-assets/ \
             --delete \
             --cache-control "no-cache,no-store,must-revalidate" \
             --metadata-directive REPLACE \
             --exclude "source-backups/*"; then
            echo "✅ S3 deployment successful!"
          else
            echo "❌ S3 deployment failed!"
            exit 1
          fi

      - name: Verify S3 deployment
        run: |
          echo "🔍 Verifying S3 deployment..."
          if aws s3 ls s3://accesseasy-patrol-assets/index.html; then
            echo "✅ index.html found in S3"
          else
            echo "❌ index.html NOT found in S3"
            exit 1
          fi

      - name: Invalidate CloudFront cache
        run: |
          echo "🔄 Invalidating CloudFront cache..."
          DISTRIBUTION_ID="${{ secrets.AWS_PATROL_CLOUDFRONT_DISTRIBUTION_ID }}"
          if [ -z "$DISTRIBUTION_ID" ]; then
            echo "❌ AWS_PATROL_CLOUDFRONT_DISTRIBUTION_ID secret is not set!"
            exit 1
          fi
          
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)
          
          echo "✅ CloudFront invalidation created: $INVALIDATION_ID"

      - name: Final verification
        run: |
          echo "🎉 Deployment completed successfully!"
          echo "🔗 Live site: https://patrol.accesseasy.in"
