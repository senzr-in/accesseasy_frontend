          "name": "How does AccessEasy Patrol verify checkpoints without internet?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "AccessEasy Patrol uses an offline-first local event queue on the mobile device. When a guard scans an NFC tag or QR code in a cellular dead zone, the scan is saved locally with an immutable device timestamp. When connectivity is restored, all queued events sync automatically to the cloud in chronological order — ensuring zero data loss."
          }
        },
        {
          "@type": "Question",
          "name": "What is the 4-Tier GPS Geofence accuracy system in AccessEasy Patrol?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The 4-tier GPS accuracy evaluator classifies every checkpoint scan into one of four verdicts: Valid (guard inside geofence, high GPS accuracy), Warning (boundary fringe), Uncertain (excessive satellite drift, location unconfirmed), or Violation (guard outside geofence boundary). This system prevents false alarms from GPS drift and blocks location spoofing attempts."
          }
        },
        {
          "@type": "Question",
          "name": "Can AccessEasy Patrol replace legacy guard tour wand systems?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Unlike legacy electronic wand systems that require manual USB docking at shift end and provide no real-time visibility, AccessEasy Patrol provides real-time cloud visibility, instant incident alerts, photo and voice evidence capture, and automated compliance reports from standard Android or iOS smartphones — no proprietary hardware required."
          }
        },
        {
          "@type": "Question",
          "name": "What checkpoint types does AccessEasy Patrol support?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "AccessEasy Patrol supports NFC tag scanning (passive tap, no internet required), QR code scanning (camera-based, works offline), and GPS proximity-based checkpoints. Each checkpoint is tied to a site location with a configurable geofence radius and accuracy threshold."
          }
        },
        {
          "@type": "Question",
          "name": "Does AccessEasy Patrol work in areas with no cellular signal?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. The AccessEasy Patrol mobile app is built offline-first. All checkpoint scans, incident reports, and attendance events are stored locally in an SQLite database. A background sync worker automatically uploads all pending events when any network connection is restored, maintaining the original device timestamps."
          }
        }
      ]
    }
