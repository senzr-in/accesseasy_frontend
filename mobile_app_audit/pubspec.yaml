name: accesseasy_patrol
description: "Guard Patrol — Security Guard Patrol Mobile App by Senzr"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.2

  # ── Shared package (auth, theme, services, UI components) ─
  accesseasy_shared:
    path: ../accesseasy_shared

  # ── State Management ──────────────────────────────────
  get: ^4.6.6
  provider: ^6.1.2
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  flutter_hooks: ^0.18.0

  # ── Networking & Backend ──────────────────────────────
  http: ^1.2.2
  dio: ^5.9.0
  directus_core: ^0.11.0

  # ── Local Storage ─────────────────────────────────────
  shared_preferences: ^2.3.4
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  sqflite: ^2.3.3+1
  path_provider: ^2.1.5
  path: ^1.8.3

  # ── Firebase ──────────────────────────────────────────
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  firebase_messaging: ^15.1.6
  firebase_analytics: ^11.3.5

  # ── Authentication ────────────────────────────────────
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.1
  app_tracking_transparency: ^2.0.6

  # ── Notifications ─────────────────────────────────────
  flutter_local_notifications: ^19.5.0
  onesignal_flutter: ^5.0.4

  # ── Location & Background (Patrol tracking) ───────────
  geolocator: ^13.0.4
  location: ^6.0.2
  permission_handler: ^12.0.1
  flutter_foreground_task: ^8.17.0
  flutter_background_service: ^5.0.5
  workmanager: ^0.7.0

  # ── QR Code ───────────────────────────────────────────
  qr_code_scanner_plus: ^2.0.13
  qr_flutter: ^4.0.0

  # ── Audio Recording ───────────────────────────────────
  record: ^7.1.1

  # ── NFC & Sensors (Patrol Checkpoints) ────────────────
  nfc_manager: ^3.4.0
  pedometer: ^4.0.1
  flutter_compass: ^0.8.0

  # ── Connectivity ──────────────────────────────────────
  connectivity_plus: ^6.0.5

  # ── UI & Theming ──────────────────────────────────────
  google_fonts: ^6.2.1
  adaptive_theme: 3.4.1
  flutter_animate: ^4.5.0
  loading_animation_widget: ^1.2.0
  shimmer: ^3.0.0
  skeletonizer: ^1.4.2
  smooth_page_indicator: ^1.2.0+3
  animated_text_kit: ^4.2.2
  flutter_spinkit: 5.2.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1
  badges: ^3.1.2
  glassmorphism: ^3.0.0
  flutter_slidable: ^3.0.0
  dotted_line: ^3.2.3

  # ── Forms & Input ─────────────────────────────────────
  pinput: 5.0.0
  sms_autofill: ^2.4.1
  intl_phone_number_input: ^0.7.4
  dropdown_button2: ^2.3.9
  flutter_typeahead: ^5.0.0

  # ── Media ─────────────────────────────────────────────
  image_picker: ^1.1.2
  open_file: ^3.5.10
  flutter_cache_manager: ^3.3.1

  # ── Date/Time & Utils ─────────────────────────────────
  intl: ^0.19.0
  timezone: ^0.10.1
  ntp: ^2.0.0
  uuid: ^4.1.0
  table_calendar: ^3.1.3

  # ── Device Info ───────────────────────────────────────
  device_info_plus: ^11.1.1
  package_info_plus: ^8.2.1
  battery_plus: ^6.1.1
  app_settings: ^6.0.0

  # ── Real-time ─────────────────────────────────────────
  web_socket_channel: ^2.4.0
  socket_io_client: ^2.0.3
  mqtt_client: ^10.5.1

  # ── Misc ──────────────────────────────────────────────
  share_plus: ^10.1.2
  url_launcher: ^6.3.1
  in_app_update: ^4.0.3
  restart_app: ^1.3.2
  encrypt: ^5.0.3
  crypto: ^3.0.6
  synchronized: ^3.3.0+3
  font_awesome_flutter: 10.7.0
  fl_chart: ^0.69.0
  signature: ^5.5.0
  numberpicker: ^2.1.2
  lucide_icons_flutter: ^3.1.14+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: any
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logoPatrol.png"
  adaptive_icon_background: "#0B1320"
  adaptive_icon_foreground: "assets/logoPatrol.png"


dependency_overrides:
  intl: any

flutter:
  uses-material-design: true
  assets:
    - assets/



